name: skyaura
description: "SkyAura - Precise & elegant weather app with glassmorphism UI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.2.0
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  connectivity_plus: ^6.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  # Tambahkan baris di bawah ini agar folder assets terbaca oleh Flutter
  assets:
    - assets/images/ 
    # Atau - assets/icons/ sesuaikan dengan nama folder yang kamu pakai

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 23
